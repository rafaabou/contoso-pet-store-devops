# ============================================
# kube-state-metrics (TASK-263 step 1): cluster-state metrics for
# Prometheus (deployments, restarts, quotas feed dashboards + alerts).
# Apply: kubectl apply -f 20-kube-state-metrics.yaml
# Rollback: kubectl delete -f 20-kube-state-metrics.yaml
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      # Cross-PC API reads are cluster-wide; KSM may land anywhere.
      # Its metrics reach VM Prometheus via Alloy remote-write (100.x).
      containers:
      - name: kube-state-metrics
        # Pin verified: bump after checking latest upstream releases
        image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
        args: ["--port=8080", "--telemetry-port=8081"]
        ports:
        - containerPort: 8080
          name: metrics
        - containerPort: 8081
          name: telemetry
        resources:
          requests: {memory: "64Mi", cpu: "50m"}
          limits: {memory: "256Mi", cpu: "250m"}
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app: kube-state-metrics
spec:
  selector:
    app: kube-state-metrics
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
  - name: telemetry
    port: 8081
    targetPort: 8081
