---
# ============================================
# Role: opentelemetry
# Install OTel Collector + Jaeger + Loki
# on dedicated monitoring VM
# ============================================

# --- Install OpenTelemetry Collector ---

- name: Create otel user
  ansible.builtin.user:
    name: otel
    shell: /bin/false
    system: yes
    create_home: no

- name: Create otel directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: otel
    group: otel
    mode: "0755"
  loop:
    - /opt/otelcol
    - /opt/otelcol/data
    - /etc/otelcol

- name: Download OpenTelemetry Collector
  ansible.builtin.get_url:
    url: "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v{{ otel_version }}/otelcol_{{ otel_version }}_linux_amd64.tar.gz"
    dest: /tmp/otelcol.tar.gz
    mode: "0644"
  register: otel_download

- name: Extract OTel Collector
  ansible.builtin.unarchive:
    src: /tmp/otelcol.tar.gz
    dest: /opt/otelcol
    remote_src: yes
  when: otel_download.changed

- name: Copy OTel Collector config
  ansible.builtin.template:
    src: otel-config.yml.j2
    dest: /etc/otelcol/config.yml
    owner: otel
    group: otel
    mode: "0644"
  notify: restart otelcol

- name: Create OTel Collector systemd service
  ansible.builtin.template:
    src: otelcol.service.j2
    dest: /etc/systemd/system/otelcol.service
    mode: "0644"
  notify: restart otelcol

- name: Enable and start OTel Collector
  ansible.builtin.systemd:
    name: otelcol
    state: started
    enabled: yes
    daemon_reload: yes

# --- Install Jaeger ---

- name: Create jaeger user
  ansible.builtin.user:
    name: jaeger
    shell: /bin/false
    system: yes
    create_home: no

- name: Download Jaeger
  ansible.builtin.get_url:
    url: "https://github.com/jaegertracing/jaeger/releases/download/v{{ jaeger_version }}/jaeger-{{ jaeger_version }}-linux-amd64.tar.gz"
    dest: /tmp/jaeger.tar.gz
    mode: "0644"
  register: jaeger_download

- name: Extract Jaeger
  ansible.builtin.unarchive:
    src: /tmp/jaeger.tar.gz
    dest: /tmp
    remote_src: yes
  when: jaeger_download.changed

- name: Copy Jaeger binaries
  ansible.builtin.copy:
    src: "/tmp/jaeger-{{ jaeger_version }}-linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    remote_src: yes
    owner: root
    group: root
    mode: "0755"
  loop:
    - jaeger-all-in-one
  when: jaeger_download.changed

- name: Create Jaeger systemd service
  ansible.builtin.template:
    src: jaeger.service.j2
    dest: /etc/systemd/system/jaeger.service
    mode: "0644"
  notify: restart jaeger

- name: Enable and start Jaeger
  ansible.builtin.systemd:
    name: jaeger
    state: started
    enabled: yes
    daemon_reload: yes

# --- Install Loki ---

- name: Create loki user
  ansible.builtin.user:
    name: loki
    shell: /bin/false
    system: yes
    create_home: no

- name: Create loki directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: loki
    group: loki
    mode: "0755"
  loop:
    - /opt/loki
    - /opt/loki/data
    - /etc/loki

- name: Install unzip for Loki
  ansible.builtin.apt:
    name: unzip
    state: present

- name: Download Loki
  ansible.builtin.get_url:
    url: "https://github.com/grafana/loki/releases/download/v{{ loki_version }}/loki-linux-amd64.zip"
    dest: /tmp/loki.zip
    mode: "0644"
  register: loki_download

- name: Extract Loki
  ansible.builtin.unarchive:
    src: /tmp/loki.zip
    dest: /usr/local/bin
    remote_src: yes
  when: loki_download.changed

- name: Copy Loki config
  ansible.builtin.template:
    src: loki-config.yml.j2
    dest: /etc/loki/config.yml
    owner: loki
    group: loki
    mode: "0644"
  notify: restart loki

- name: Create Loki systemd service
  ansible.builtin.template:
    src: loki.service.j2
    dest: /etc/systemd/system/loki.service
    mode: "0644"
  notify: restart loki

- name: Enable and start Loki
  ansible.builtin.systemd:
    name: loki
    state: started
    enabled: yes
    daemon_reload: yes
